context:
  version: "0.9.5"

package:
  name: libayatana-indicator
  version: ${{ version }}

source:
  url: https://github.com/AyatanaIndicators/libayatana-indicator/archive/${{ version }}.tar.gz
  sha256: 73d71c908b803f12e4a5ecd8392511b58afbdd0c82ad7909611a17bb7847c5c8

build:
  number: 0
  skip: not linux

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - cmake
    - ninja
    - pkg-config
    # glib-mkenums / glib-genmarshal
    - glib-tools
  host:
    # webkit2gtk4.1 (<=2.48.5_4) leaks ruby's run_export (libffi <3.6), which makes it
    # uninstallable next to libglib >=2.90 (libffi 3.7). Build against an older glib so
    # that our libglib run_export stays compatible with it, e.g. for Tauri apps.
    - glib <2.90
    - gtk3
    - libayatana-ido
    # gio-2.0.pc lists zlib in Requires.private, so pkg-config needs it present.
    - zlib
    # fontconfig.pc (pulled in by gtk+-3.0.pc) requires expat.pc
    - expat
  ignore_run_exports:
    from_package:
      - zlib
      - expat
  run_exports:
    # SOVERSION 7 (ABI_VERSION in CMakeLists.txt)
    - ${{ pin_subpackage('libayatana-indicator', upper_bound='x.x') }}

tests:
  - package_contents:
      include:
        - libayatana-indicator3-0.4/libayatana-indicator/indicator-object.h
      lib:
        - ayatana-indicator3
      files:
        - lib/pkgconfig/ayatana-indicator3-0.4.pc
  - script:
      - pkg-config --exists --print-errors ayatana-indicator3-0.4
    requirements:
      run:
        - pkg-config
        # gio-2.0.pc and fontconfig.pc (via gtk+-3.0.pc) need these .pc files
        - zlib
        - expat

about:
  homepage: https://github.com/AyatanaIndicators/libayatana-indicator
  summary: Ayatana Indicators shared library (GTK3)
  description: |
    libayatana-indicator provides the shared code used by Ayatana indicator
    renderers and by libayatana-appindicator.
  license: GPL-3.0-only
  license_file: COPYING
  repository: https://github.com/AyatanaIndicators/libayatana-indicator

extra:
  recipe-maintainers:
    - maurosilber
